# Spray gun on the robot flange. Tool X = spray direction.
# The TCP is computed from the gun + nozzle CAD, unless `tcp` is given
# (X, Y, Z mm / A, B, C deg, KUKA TOOL_DATA convention), which takes priority.
#
# Controller backup (KSS 8.7.2, 2022): TOOL_DATA[1] "CIK" = {X 517.79, Y 214.24,
# Z 130.91, A 0, B 0, C 0} - position only (orientation never taught). It does not
# match the CAD mounting below yet: CHECK how the gun sits on the flange.
name: Impact Gun 6/11 EvoCSII
verified: false
# tcp: {x: 517.79, y: 214.24, z: 130.91, a: 0, b: 0, c: 0}

gun:
  step_file: assets/cad/Impact_Gun_6-11_EvoCSII Gun without nozzles.stp
  # Gun CAD: origin = nozzle mounting face centre, spray along +Y.
  mount_point: [-138.0, -274.0, 0.0]   # centre of the robot mounting face (normal -X)
  clock_deg: 0.0      # rotation of the gun about the flange axis - CHECK on the robot
  nozzle: central_injector
  nozzles:
    # Nozzle CAD: spray along -X, outlet face at x = exit_x_mm, the face that
    # seats on the gun nozzle face at x = mount_x_mm (both measured from the CAD).
    central_injector:
      label: Central Injector Kit (CIK)
      step_file: assets/cad/Impact_Central_Injector.stp
      exit_x_mm: 30.0
      mount_x_mm: 209.7   # back face of the clamp housing (same body as the radial injector)
    radial_injector:
      label: Radial injector
      step_file: assets/cad/Impact_Radial_Injector.stp
      exit_x_mm: 30.0
      mount_x_mm: 209.7
