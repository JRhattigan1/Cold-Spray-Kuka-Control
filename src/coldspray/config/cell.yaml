# Cell layout in WORLD = the cell CAD coordinate system (mm), from
# assets/cad/Cold Spray Cell.stp with all axes at 0.

cad_cache: assets/cad/cache/cell   # mesh cache made by coldspray.cad.step_cache

# Robot root (base mounting face) with the gantry at 0. The robot hangs off
# the side of the gantry carriage: its A1 axis points along world -Y.
robroot: {x: 1845.75, y: 1069.0, z: 3196.33, a: -90.0, b: 90.0, c: 0.0}
robot_cad_pose_deg: [0, -90, 90, 0, 0, 0]   # pose the robot is drawn in, in the CAD

# Gantry (E1) traverses along world X and carries the robot.
# +E1 moves the robot towards the turntable (world -X) - confirmed on the robot.
# CHECK: that E1 = 0 is where the CAD shows the carriage, and the travel limits.
gantry:
  axis: E1
  direction: [-1.0, 0.0, 0.0]
  limits_mm: [0.0, 5500.0]    # 5500 mm stroke (KIEHNE manual); CAD carriage sits near the +X end
  position_mm: 2730.0         # used by programs for now: puts the robot over the turntable

# Work base: top centre of the turntable faceplate (tilt and rotation at 0).
# Toolpaths are written relative to this; it moves with the turntable axes.
# Controller backup: BASE_DATA[1] "turntable" = {X 1482.75, Y -661.14,
# Z -1509.18, A 90.27} in KUKA WORLD - compare once $WORLD/$ROBROOT are known.
base_number: 1
base: {x: -884.56, y: -421.0, z: 1469.94, a: 0.0, b: 0.0, c: 0.0}
# A KRL base picked on the part (Part step) writes programs relative to
# BASE_DATA[part_base_number] instead, taught on the real part.
part_base_number: 2

# GTV KDT3000 tilting turntable, axes measured from the cell CAD:
#  tilt axis along world Y through the tilt trunnions, which sits exactly at
#  the tailstock centre height (z 1100) - so at 90 deg tilt the faceplate axis
#  lines up with the tailstock; rotation axis = faceplate axis.
# Axis numbers from the controller programs (E2 0..90 deg, E5 indexed 0/90/180/270).
# CHECK on the robot: +E2 tilts the faceplate towards the tailstock (+X), and
# which way +E5 turns (assumed counter-clockwise seen from above the faceplate).
turntable:
  tilt:
    axis: E2
    point: [-884.56, -421.0, 1100.0]
    direction: [0.0, 1.0, 0.0]
    limits_deg: [0.0, 90.0]
    position_deg: 0.0
  rotation:
    axis: E5
    point: [-884.56, -421.0, 1469.94]
    direction: [0.0, 0.0, 1.0]
    limits_deg: [-355.0, 355.0]
    position_deg: 0.0
    max_speed_deg_s: 156.0  # 2600 rpm motor / i = 100 (KDT3000 manual) - CHECK $VEL_AXIS_MA
  # true if the controller couples the turntable mathematically to BASE_DATA[1]
  # (positions then move with the faceplate); false writes positions in the
  # fixed base and adds the axis values to every point.
  coupled: false

tool_number: 1        # TOOL_DATA index holding the spray gun TCP
gun_output: 1         # $OUT number that switches the spray on
ptp_velocity_pct: 20  # PTP speed override in generated programs

home_deg: [0, -90, 90, 0, 0, 0]

# The gun must not point far down (bad for the equipment): spray direction at
# most this many degrees below horizontal. Steeper points are flagged.
gun_max_down_deg: 70.0

# Gun cables and powder hose wind round the wrist: most A4 / A6 may turn from
# home before a warning. CHECK against the cable dressing on the robot.
cable_windup_deg: {A4: 270.0, A6: 270.0}

# Warm-up / powder purge point in free space (optional). The gun goes here,
# switches the spray on and dwells, then travels to the part with the spray on;
# it returns at the end (and every N layers) and switches off here.
# purge:
#   enabled: true
#   point: [-884.56, 400.0, 2000.0]  # nozzle exit target, WORLD mm - CHECK clear of everything
#   spray_dir: [0.0, -1.0, 0.0]      # WORLD, horizontal into the spray booth - CHECK on the cell
#   dwell_s: 5.0                     # spray on at the point before moving off
#   at_start: true
#   at_end: true
#   every_n_layers: 0                # 0: only at start / end
#   approach_mm: 100.0               # lead-in, back from the point along spray_dir
